[build-system]
requires = [
    "setuptools>=42",
    "setuptools_scm[toml]>=3.4.3",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/bilby_glitch/_version.py"


[project]
name = "bilby_glitch"
authors = [
  { name="Rhiannon Udall", email="rhiannon.udall@ligo.org" },
]
description = "An addon package for bilby to allow inference of parametrically modeled glitches"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "bilby[gw]",
    "bilby_pipe",
    "ptfp",
    "makefun",
    "jax"
]
dynamic = ["version"]

[project.scripts]
    glitch_bilby_pipe = "bilby_glitch.pipe:glitch_bilby_pipe"
    glitch_bilby_pipe_analysis = "bilby_glitch.pipe:glitch_bilby_pipe_analysis"
    glitch_bilby_pipe_generation = "bilby_glitch.pipe:glitch_bilby_pipe_generation"
    glitch_bilby_pipe_create_injection_file = "bilby_glitch.pipe:glitch_bilby_pipe_create_injection_file"

[tool.setuptools.dynamic]
version = {attr = "bilby_glitch._version.__version__"}

[project.urls]
"Homepage" = "https://git.ligo.org/rhiannon.udall/bilby_glitch"
"Bug Tracker" = "https://git.ligo.org/rhiannon.udall/bilby_glitch/-/issues"

[project.entry-points."bilby_glitch.xp"]
bilby_glitch_parametric_models = "bilby_glitch.models.parametric_glitch_models"
bilby_glitch_bilby_interface = "bilby_glitch.bilby_interface.bilby_interface"

[project.entry-points."bilby_glitch.scs"]
bilby_glitch_parametric_models = "bilby_glitch.models.parametric_glitch_models"
